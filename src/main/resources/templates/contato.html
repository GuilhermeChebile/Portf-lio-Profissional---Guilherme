<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{site.title})}"></head>
<body>
<header th:replace="~{fragments :: header(${active})}"></header>

<main id="main">
    <section class="section page-top">
        <div class="container">
            <h1 class="page-title" th:text="#{contact.title}">Contato</h1>
            <p class="lead" th:text="#{contact.lead}">Escolha o canal que preferir.</p>

            <div class="contact-grid">
                <ul class="channels">
                    <li>
                        <a th:href="|mailto:${contact.email}|">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                            <span><strong th:text="#{contact.email}">E-mail</strong><small th:text="${contact.email}">email</small></span>
                        </a>
                    </li>
                    <li>
                        <a th:href="|https://wa.me/${contact.whatsappPersonal}|" target="_blank" rel="noopener noreferrer">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
                            <span><strong th:text="#{contact.whatsapp.personal}">WhatsApp pessoal</strong><small th:text="${contact.phonePersonal}">tel</small></span>
                        </a>
                    </li>
                    <li>
                        <a th:href="|https://wa.me/${contact.whatsappBusiness}|" target="_blank" rel="noopener noreferrer">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
                            <span><strong th:text="#{contact.whatsapp.business}">WhatsApp comercial</strong><small th:text="${contact.phoneBusiness}">tel</small></span>
                        </a>
                    </li>
                    <li>
                        <a th:href="|tel:+${contact.whatsappPersonal}|">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
                            <span><strong th:text="#{contact.phone.personal}">Telefone pessoal</strong><small th:text="${contact.phonePersonal}">tel</small></span>
                        </a>
                    </li>
                    <li>
                        <a th:href="|tel:+${contact.whatsappBusiness}|">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
                            <span><strong th:text="#{contact.phone.business}">Telefone comercial</strong><small th:text="${contact.phoneBusiness}">tel</small></span>
                        </a>
                    </li>
                    <li th:if="${!#strings.isEmpty(contact.linkedin)}">
                        <a th:href="${contact.linkedin}" target="_blank" rel="noopener noreferrer">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                            <span><strong th:text="#{contact.linkedin}">LinkedIn</strong></span>
                        </a>
                    </li>
                    <li th:if="${!#strings.isEmpty(contact.github)}">
                        <a th:href="${contact.github}" target="_blank" rel="noopener noreferrer">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.3 6.4-1.5 6.4-7a5.4 5.4 0 0 0-1.5-3.8 5 5 0 0 0-.1-3.7s-1.2-.3-3.9 1.5a13.4 13.4 0 0 0-7 0C6.5 2.8 5.3 3.1 5.3 3.1a5 5 0 0 0-.1 3.7 5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.6 6.4 7a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
                            <span><strong th:text="#{contact.github}">GitHub</strong></span>
                        </a>
                    </li>
                </ul>

                <form class="form" th:action="@{/contato}" th:object="${contactForm}" method="post" novalidate>
                    <h2 th:text="#{contact.form.title}">Envie uma mensagem</h2>

                    <p class="alert ok" role="status" th:if="${sent}" th:text="#{contact.success}">Enviado.</p>
                    <p class="alert err" role="alert" th:if="${failed}" th:text="#{contact.failure}">Falhou.</p>

                    <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                        <label for="name" th:text="#{contact.form.name}">Nome</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="100" required autocomplete="name">
                        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro</span>
                    </div>

                    <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                        <label for="email" th:text="#{contact.form.email}">E-mail</label>
                        <input id="email" type="email" th:field="*{email}" maxlength="150" required autocomplete="email">
                        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</span>
                    </div>

                    <div class="field" th:classappend="${#fields.hasErrors('message')} ? 'has-error'">
                        <label for="message" th:text="#{contact.form.message}">Mensagem</label>
                        <textarea id="message" th:field="*{message}" rows="6" minlength="10" maxlength="2000" required></textarea>
                        <span class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}">Erro</span>
                    </div>

                    <div class="hp" aria-hidden="true">
                        <label>Website <input type="text" th:field="*{website}" tabindex="-1" autocomplete="off"></label>
                    </div>

                    <button class="btn btn-primary" type="submit" th:data-sending="#{contact.form.sending}" th:text="#{contact.form.send}">Enviar mensagem</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
